<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post 1080x1350</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --primaria: #1f6f78; --acento: #f28c6a; --fundo: #f7f5f2; --texto: #1d232b; }
  html, body { margin: 0; }
  .post { width: 1080px; height: 1350px; box-sizing: border-box; padding: 96px 80px;
    background: var(--fundo); color: var(--texto); display: flex; flex-direction: column;
    justify-content: space-between; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; }
  .post::before { content: ""; position: absolute; width: 720px; height: 720px; border-radius: 50%;
    background: var(--primaria); opacity: .12; right: -240px; top: -200px; }
  .selo { align-self: flex-start; background: var(--acento); color: #fff; font-weight: 600;
    font-size: 28px; padding: 12px 24px; border-radius: 999px; }
  h1 { font-family: Poppins, sans-serif; font-weight: 800; font-size: 104px; line-height: 1.02; margin: 0; letter-spacing: -1px; }
  h1 em { font-style: normal; color: var(--primaria); }
  p { font-size: 38px; line-height: 1.35; margin: 32px 0 0; max-width: 860px; }
  .rodape { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 600; }
  .cta { background: var(--primaria); color: #fff; padding: 20px 36px; border-radius: 16px; }
</style>
</head>
<body>
  <main class="post">
    <span class="selo">DICA RÁPIDA</span>
    <div>
      <h1>Título curto com <em>destaque</em></h1>
      <p>Uma ou duas linhas de apoio explicando o benefício principal.</p>
    </div>
    <div class="rodape"><span>@perfil</span><span class="cta">Saiba mais →</span></div>
  </main>
</body>
</html>
